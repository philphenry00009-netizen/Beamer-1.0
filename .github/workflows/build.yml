name: Build FcAm APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and unzip project
        run: |
          ZIP=$(find . -maxdepth 3 -iname '*.zip' | head -n1)
          echo "Found zip: $ZIP"
          test -n "$ZIP" || { echo "NO ZIP IN REPO"; exit 1; }
          unzip -o -q "$ZIP" -d unpacked
          SETTINGS=$(find unpacked -name settings.gradle* | head -n1)
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Change App Display Name to FcAm
        run: |
          # Find the strings.xml file and change the app_name value
          STRINGS_FILE=$(find unpacked -name strings.xml | grep "src/main/res/values/strings.xml" | head -n1)
          if [ -n "$STRINGS_FILE" ]; then
            echo "Updating app name in $STRINGS_FILE"
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">FcAm<\/string>/g' "$STRINGS_FILE"
          else
            echo "strings.xml not found, skipping name change"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Prepare Final APK
        run: |
          OLD_PATH=$(find unpacked -name "*-debug.apk" | head -n1)
          NEW_PATH="${{ env.PROJECT_DIR }}/FcAm.apk"
          mv "$OLD_PATH" "$NEW_PATH"
          echo "FINAL_APK_PATH=$NEW_PATH" >> "$GITHUB_ENV"

      - name: Release FcAm APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "FcAm Release #${{ github.run_number }}"
          files: ${{ env.FINAL_APK_PATH }}
          body: "Automated build of FcAm app."
          draft: false
          prerelease: false
